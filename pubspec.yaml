name: metro_line
description: "Tunnel Tech — offline-first metro maintenance assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management (Riverpod 3.x)
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7

  # Persistence (Drift SQLite + Paths)
  drift: ^2.24.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.6
  path: ^1.9.1

  # Routing
  go_router: ^14.8.0

  # Preferences & Connectivity
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4

  # Localization
  intl: any

  # URL Launcher (tel: links)
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation & Tools
  build_runner: ^2.4.14
  riverpod_generator: ^4.0.9
  drift_dev: ^2.24.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/manual.json

  fonts:
    - family: NotoSansGujarati
      fonts:
        - asset: assets/fonts/NotoSansGujarati-Variable.ttf
